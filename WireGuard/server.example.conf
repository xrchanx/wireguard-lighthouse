[Interface]
Address = 10.66.66.1/24
ListenPort = 51820
MTU = 1340
PrivateKey = <SERVER_PRIVATE_KEY>

# UDP 443 is the compatibility entry point; WireGuard itself listens on 51820.
PostUp = iptables -t nat -C PREROUTING -i eth0 -p udp --dport 443 -j REDIRECT --to-ports 51820 2>/dev/null || iptables -t nat -I PREROUTING 1 -i eth0 -p udp --dport 443 -j REDIRECT --to-ports 51820; iptables -t nat -C POSTROUTING -s 10.66.66.0/24 -o eth0 -j MASQUERADE 2>/dev/null || iptables -t nat -A POSTROUTING -s 10.66.66.0/24 -o eth0 -j MASQUERADE
PostDown = while iptables -t nat -C PREROUTING -i eth0 -p udp --dport 443 -j REDIRECT --to-ports 51820 2>/dev/null; do iptables -t nat -D PREROUTING -i eth0 -p udp --dport 443 -j REDIRECT --to-ports 51820; done; while iptables -t nat -C POSTROUTING -s 10.66.66.0/24 -o eth0 -j MASQUERADE 2>/dev/null; do iptables -t nat -D POSTROUTING -s 10.66.66.0/24 -o eth0 -j MASQUERADE; done

[Peer]
# iPhone: 10.66.66.2/32
PublicKey = <IPHONE_PUBLIC_KEY>
AllowedIPs = 10.66.66.2/32

[Peer]
# Windows: 10.66.66.3/32
PublicKey = <WINDOWS_PUBLIC_KEY>
AllowedIPs = 10.66.66.3/32

[Peer]
# Android: 10.66.66.4/32
PublicKey = <ANDROID_PUBLIC_KEY>
AllowedIPs = 10.66.66.4/32

[Peer]
# macOS: 10.66.66.5/32
PublicKey = <MAC_PUBLIC_KEY>
AllowedIPs = 10.66.66.5/32
